name: 版本发布

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 验证、构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 验证版本标签与发布基线
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag) is None:
              raise SystemExit('标签必须使用 v主版本.次版本.修订号')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if tag != 'v' + version:
              raise SystemExit('标签与项目版本不一致')
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          marker = '## ' + version + ' '
          if marker not in changelog:
              raise SystemExit('缺少此版本的中文更新记录')
          notes = changelog.split(marker, 1)[1].split('\n## ', 1)[0]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(
              '## ' + version + ' ' + notes, encoding='utf-8')
          PY
      - name: 安装测试与构建依赖
        run: python -m pip install ".[serial,test,dev]"
      - name: 确认 Lua 测试运行环境可用
        run: python -c "from lupa import LuaRuntime; LuaRuntime()"
      - name: 运行离线与跨语言测试
        run: python -m unittest discover -s tests -v
      - name: 构建源码分发包与 wheel
        run: python -m build
      - name: 验证干净环境安装
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c "from shiteng_rs485 import Decoder, heartbeat; assert len(Decoder().feed(heartbeat())) == 1"
      - name: 生成完整源码与校验文件
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix="shiteng-rs485-${RELEASE_TAG}/" --output="dist/shiteng-rs485-${RELEASE_TAG}-source.zip" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
      - name: 上传产物并公开版本
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "湿腾 RS485 协议库 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false
